syntax = "proto3";

option go_package = "github.com/hyperledger/fabric-x-committer/api/servicepb";

package servicepb;

import "api/msppb/msp.proto";
import "common/common.proto";

// AuthService is the central authentication and authorization service. It hands out single-use
// challenges (IssueNonce), authenticates clients from a signed envelope and mints cert-bound JWTs
// (Authenticate), and authorizes a token against a resource policy for a resource server
// (Authorize). Only the AuthService mints and verifies tokens; resource servers hold no signing keys
// and delegate every decision here.
service AuthService {
    // IssueNonce issues a single-use, short-lived nonce the client must embed in the SignatureHeader of
    // the envelope it then presents to Authenticate. It is the mandatory first step of authentication:
    // because the server chooses the nonce and consumes it on use, a captured envelope cannot be
    // replayed even within the freshness window.
    rpc IssueNonce(IssueNonceRequest) returns (IssueNonceResponse);
    // Authenticate verifies a signed envelope and mints a short-lived, cert-bound JWT.
    rpc Authenticate(AuthenticateRequest) returns (AuthenticateResponse);
    // Authorize evaluates a token against a resource policy for a resource server. A stream calls it
    // again with the same token whenever its cached decision lapses, so token expiry and configuration
    // changes both take effect on an established stream.
    rpc Authorize(AuthorizeRequest) returns (AuthorizeResponse);
}

message IssueNonceRequest {
}

message IssueNonceResponse {
    // nonce is the server-issued challenge the client places in its envelope's SignatureHeader.Nonce.
    // It is valid for a single Authenticate call and expires at expires_at.
    bytes nonce = 1;
    // expires_at is the nonce expiry in unix seconds.
    int64 expires_at = 2;
}

message AuthenticateRequest {
    // signed_envelope carries the client's serialized MSP identity
    // and a signature over the payload; under mutual TLS its ChannelHeader also carries the TLS
    // certificate hash the token is bound to. Its SignatureHeader.Nonce must be an unconsumed nonce
    // previously issued by IssueNonce.
    common.Envelope signed_envelope = 1;
    // requested_scope optionally narrows the token's authority to these gRPC full-method names
    // (least privilege). A requested scope may only narrow, never broaden, the identity's authority.
    repeated string requested_scope = 2;

    // 3 held requested_namespaces. Namespace scoping is deferred: only the two resources whose request
    // names the namespaces it touches can enforce it, so it is a design of its own rather than a field
    // on the token. See the RFC's "Future work: namespace scoping".
    reserved 3;
}

message AuthenticateResponse {
    // token is the minted cert-bound JWT the client attaches to subsequent RPCs.
    string token = 1;
    // expires_at is the token expiry in unix seconds.
    int64 expires_at = 2;
}

message AuthorizeRequest {
    // token is the client's JWT, forwarded by the resource server.
    string token = 1;
    // resource is the gRPC full method being authorized, e.g. "/committerpb.QueryService/GetRows".
    string resource = 2;
    // tls_cert_hash is the SHA-256 of the caller's TLS certificate observed at the resource server.
    // It is empty when the caller connected without a client certificate.
    bytes tls_cert_hash = 3;

    // 4 and 5 held the namespaces the request touches and an all-namespaces flag. With namespace
    // scoping deferred, a resource server no longer inspects the request body at all.
    reserved 4, 5;
}

message AuthorizeResponse {
    // 2 and 3 held the resolved identity and the token's namespace allowlist. The resource server needs
    // neither: it re-presents the token, and namespace scoping is deferred.
    reserved 2, 3;

    // authorized is true when the identity satisfies the resource policy. The RPCs return a gRPC
    // status error for every non-authorized outcome (Unauthenticated for an invalid, expired, or
    // unknown token or a certificate mismatch; PermissionDenied for a scope or policy denial;
    // Unavailable before the configuration is loaded), so a successful response always has
    // authorized = true.
    bool authorized = 1;
    // token_expires_at is the bound token's expiry in unix seconds. A resource server caches an
    // authorization decision for a stream no longer than this, so an expired token cannot keep an
    // established stream alive.
    int64 token_expires_at = 4;
}

// TokenRecord is the persisted token-to-identity binding, keyed by jti and stored proto-serialized
// in the auth service's token store. It - not the raw JWT - holds the client's MSP identity, so the
// identity is re-resolved against the latest configuration on every authorization. Records are not
// deleted to revoke: each instance caches unexpired records, so a delete on one would not be observed
// by another before the token expired anyway. A token is valid until its expiry.
message TokenRecord {
    // jti is the opaque token id and the row key.
    string jti = 1;
    // identity is the client's MSP identity. It is carried as the message rather than as marshaled
    // bytes, so neither issuing nor authorizing has to serialize it by hand.
    msppb.Identity identity = 2;
    // msp_id is the client's MSP identifier, kept for logging and quick filtering.
    string msp_id = 3;
    // cert_hash_sha256 is the cnf/x5t#S256 binding to the client's TLS certificate.
    bytes cert_hash_sha256 = 4;
    // scope is the optional least-privilege scope granted at issuance, as gRPC full-method names.
    repeated string scope = 5;
    // issued_sequence is the config sequence the identity was first resolved against.
    uint64 issued_sequence = 6;
    // expires_at is the token expiry in unix seconds, used for TTL cleanup.
    int64 expires_at = 7;

    // 8 held the namespace allowlist granted at issuance; see AuthenticateRequest's reserved 3.
    reserved 8;
}
